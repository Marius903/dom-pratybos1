<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dom pratybos</title>
  </head>
  <body>
    <h1>Dom pratybos</h1>

    <div class="container">
      <div class="forma">
        <h2>Prekių įvedimas</h2>

        <form id="productForm">
          <label>Product Code</label>
          <input type="text" id="id" placeholder="Only numbers..." />

          <label>Product Name</label>
          <input type="text" id="name" placeholder="Product name" />

          <label>Product Quantity</label>
          <input type="number" id="quantity" placeholder="Quantity" />

          <p id="message"></p>

          <div class="buttons">
            <button type="submit">Insert new</button>
            <button type="button" id="edit">Edit item</button>
            <button type="button" id="delete">Delete from LS</button>
            <button type="button" id="clear">Clear form</button>
          </div>
        </form>

        <h3>Visos prekes</h3>

        <table>
          <thead>
            <tr>
              <th>Product Code</th>
              <th>Product Name</th>
              <th>Product Quantity</th>
            </tr>
          </thead>

          <tbody id="table"></tbody>
        </table>
      </div>

      <div class="forma">
        <h2>Find Product by Code</h2>

        <form id="searchForm">
          <label>Product Code</label>
          <input type="text" id="searchId" placeholder="Only numbers..." />

          <button type="submit">Select from LS</button>
        </form>

        <p id="searchMessage"></p>

        <h3>Surasta preke</h3>

        <table>
          <thead>
            <tr>
              <th>Product Code</th>
              <th>Product Name</th>
              <th>Product Quantity</th>
            </tr>
          </thead>

          <tbody id="searchTable"></tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
